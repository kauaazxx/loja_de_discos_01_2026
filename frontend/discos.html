<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinyl Control - Cadastro de Discos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <h1>Vinyl Control - Acervo</h1>
        <a href="index.html" class="btn-secondary">Voltar ao Início</a>
    </header>

    <main class="container">
        <h2>Gerenciamento de Discos</h2>

        <!-- Formulário de Cadastro/Edição -->
        <form id="discoForm" class="form-grid">
            <input type="hidden" id="discoId">
            <div class="input-group">
                <label>Título</label>
                <input type="text" id="titulo" required>
            </div>
            <div class="input-group">
                <label>Artista / Banda</label>
                <input type="text" id="artista" required>
            </div>
            <div class="input-group">
                <label>Gênero</label>
                <input type="text" id="genero" required>
            </div>
            <div class="input-group">
                <label>Preço Custo (R$)</label>
                <input type="number" step="0.01" id="preco_custo" required>
            </div>
            <div class="input-group">
                <label>Preço Venda (R$)</label>
                <input type="number" step="0.01" id="preco_venda" required>
            </div>
            <div class="input-group">
                <label>Qtd em Estoque</label>
                <input type="number" id="quantidade_estoque" required>
            </div>
            <div class="input-group">
                <label>Estoque Mínimo</label>
                <input type="number" id="estoque_minimo" required>
            </div>
            <button type="submit" class="btn-primary" id="btnSalvarDisco">Salvar Disco</button>
        </form>

        <hr style="margin: 30px 0;">

        <!-- Área de Busca e Tabela -->
        <div class="search-bar">
            <input type="text" id="termoBusca" placeholder="Pesquisar por título ou artista...">
            <button type="button" id="btnBuscar" class="btn-secondary">Buscar</button>
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th>Título</th>
                    <th>Artista</th>
                    <th>Gênero</th>
                    <th>Venda (R$)</th>
                    <th>Estoque</th>
                    <th>Mínimo</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaDiscosBody">
                <!-- Preenchido via JavaScript -->
            </tbody>
        </table>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
